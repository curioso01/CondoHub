<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CondoHub — Sistema Integrado de Gestão Condominial</title>
  <meta name="description" content="Plataforma comercial e completa para gestão de condomínios residenciais e comerciais." />
  <link rel="stylesheet" href="/src/condo/styles.css" />
  <style>
    /* Estilos complementares de refinamento */
    .search-result-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 150ms;
    }
    .search-result-item:hover {
      background: var(--color-bg);
    }
    .user-menu-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      width: 200px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      padding: 6px 0;
      z-index: 100;
      display: none;
    }
    .user-menu-dropdown.show {
      display: block;
    }
    .user-menu-item {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--color-text);
      cursor: pointer;
      transition: background 120ms;
    }
    .user-menu-item:hover {
      background: var(--color-bg);
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- BIBLIOTECAS EXTERNAS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- SCRIPTS DO CONDOHUB -->
  <script src="/src/condo/data.js"></script>

  <!-- ENTRYPOINT REACT -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
