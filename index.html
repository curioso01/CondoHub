<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CondoHub</title>
  <meta name="description" content="SaaS B2B completo de gestão de condomínios com 11 módulos administrativos e Portal do Morador." />
  <meta property="og:title" content="CondoHub" />
  <meta property="og:description" content="SaaS B2B completo de gestão de condomínios com 11 módulos administrativos e Portal do Morador." />
  <script>
    // Intercepta e neutraliza erros injetados por extensões do navegador (MetaMask, Web3 wallet extensions)
    window.addEventListener('error', function(e) {
      var msg = e.message || '';
      var file = e.filename || '';
      if (
        msg.indexOf('MetaMask') !== -1 ||
        msg.indexOf('ethereum') !== -1 ||
        file.indexOf('extension') !== -1 ||
        file.indexOf('chrome-extension') !== -1
      ) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason;
      var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
      if (
        msg.indexOf('MetaMask') !== -1 ||
        msg.indexOf('ethereum') !== -1 ||
        msg.indexOf('Failed to connect to MetaMask') !== -1
      ) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    }, true);
  </script>
  <!-- Preservação do Design System Original do CondoHub -->
  <link rel="stylesheet" href="/src/condo/styles.css" />
  <!-- Seed de Dados Original do CondoHub e Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/src/condo/data.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
